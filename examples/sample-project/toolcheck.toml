schema_version = 1

[tools.dekit]
minimum = "0.10.3"
reason = "Graphics passthrough support"
upgrade = "Follow your team's dekit installation guide"

[tools.ruby]
exact_from = ".ruby-version"
reason = "Match the project's existing Ruby pin"
upgrade = "mise install"

[tools.robin]
minimum = "1.4"
version_args = ["version"]
version_regex = 'release: (v[0-9]+\.[0-9]+\.[0-9]+)'
reason = "Private team tooling works without a plugin"
upgrade = "Follow your team's robin installation guide"

[tools.opendhu]
command = "aa"
minimum = "1.2.3" # Illustrative example, not a verified openDHU floor
severity = "warn"
reason = "Demonstrate an older tool reported as a warning"
upgrade = "Follow your team's openDHU installation guide"

[tools.extra]
command = "toolcheck-demo-extra"
minimum = "1.0"
optional = true
reason = "Only needed for an optional workflow"
